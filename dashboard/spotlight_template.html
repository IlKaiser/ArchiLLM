<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchiLLM Modifiability Spotlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F5F6F9; --surface:#FFFFFF; --surface-alt:#EEF0F5; --border:#DCE0E8;
    --ink:#12151C; --ink-secondary:#565F70; --ink-muted:#8890A0;
    --accent:#3548C4; --accent-soft:#E7E9FB; --danger:#C0332B; --danger-soft:#FBE7E5;
    --font-sans:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
    --m-deepseek:#3548C4; --m-kimi:#B4680C; --m-gemma:#14875A; --m-qwen:#9A3EBD;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1116; --surface:#161A22; --surface-alt:#1E232D; --border:#2A3040;
      --ink:#EDEFF4; --ink-secondary:#A7AFC0; --ink-muted:#6B7385;
      --accent:#8593FF; --accent-soft:#232B55; --danger:#F0685F; --danger-soft:#3B1E1C;
      --m-deepseek:#8593FF; --m-kimi:#E8A23A; --m-gemma:#3FCB93; --m-qwen:#D48BF0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1116; --surface:#161A22; --surface-alt:#1E232D; --border:#2A3040;
    --ink:#EDEFF4; --ink-secondary:#A7AFC0; --ink-muted:#6B7385;
    --accent:#8593FF; --accent-soft:#232B55; --danger:#F0685F; --danger-soft:#3B1E1C;
    --m-deepseek:#8593FF; --m-kimi:#E8A23A; --m-gemma:#3FCB93; --m-qwen:#D48BF0;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);margin:0;padding-inline:20px;padding-block:32px 64px;}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
  header .eyebrow{font:600 12px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px;}
  h1{font:700 28px/1.15 var(--font-sans);letter-spacing:-.01em;margin:0;text-wrap:balance;}
  header p.sub{margin:6px 0 0;color:var(--ink-secondary);font-size:14.5px;max-width:78ch;}

  .model-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px 20px;border-top:4px solid var(--card-color,var(--accent));}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:18px;}
  .card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;}
  .card-head h2{font:700 17px var(--font-sans);margin:0;color:var(--card-color,var(--ink));}
  .card-metrics{display:flex;gap:16px;font:500 12.5px var(--font-sans);color:var(--ink-secondary);}
  .card-metrics b{color:var(--ink);font-family:var(--font-mono);font-weight:600;}

  .diagram-row{display:grid;grid-template-columns:1fr 1.3fr;gap:14px;margin-bottom:14px;}
  .diagram-box{border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .diagram-box img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;background:#fff;}
  .diagram-box .placeholder{color:var(--ink-muted);font-size:12px;text-align:center;padding:14px;}
  .diagram-box figcaption{position:absolute;}

  .bar-chart{display:flex;flex-direction:column;gap:6px;justify-content:center;}
  .bar-row{display:grid;grid-template-columns:20px 1fr 46px;align-items:center;gap:8px;}
  .bar-row .idx{font:600 11px var(--font-mono);color:var(--ink-muted);}
  .bar-track{height:12px;border-radius:3px;background:var(--surface-alt);overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;background:var(--card-color,var(--accent));}
  .bar-row .val{font:600 11.5px var(--font-mono);text-align:right;color:var(--ink);}

  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font:600 10.5px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);padding:0 8px 6px;border-bottom:1px solid var(--border);}
  th.num{text-align:right;}
  td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  td.num{text-align:right;font-family:var(--font-mono);color:var(--ink-secondary);white-space:nowrap;}
  td.desc{color:var(--ink-secondary);}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--surface-alt);}
  .sc-error{color:var(--danger);font-size:11.5px;}
  .not-rendered{color:var(--ink-muted);font-style:italic;font-size:11.5px;}

  .shared-note{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:10px 14px;font:500 12.5px var(--font-sans);}

  .lightbox{position:fixed;inset:0;background:rgba(6,8,11,.92);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:32px;}
  .lightbox[hidden]{display:none;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4);cursor:default;}
  .lightbox .close-btn{position:fixed;top:20px;right:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;width:32px;height:32px;color:#fff;font-size:16px;cursor:pointer;}

  footer{color:var(--ink-muted);font:400 12px var(--font-mono);}

  @media (max-width:560px){
    h1{font-size:22px;}
    .cards{grid-template-columns:1fr;}
    .diagram-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">ArchiLLM / ARCHI &middot; modifiability spotlight</p>
    <h1 id="title">Loading…</h1>
    <p class="sub" id="sub-line"></p>
  </header>

  <div id="shared-note-slot"></div>

  <div class="cards" id="cards"></div>

  <footer>
    <span>Regenerate with <span style="font-family:var(--font-mono)">python dashboard/spotlight.py [--project NAME]</span></span>
    &middot; <span id="footer-generated"></span>
  </footer>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="close-btn" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" src="" alt="Full-size diagram">
</div>

<script>
const DATA = /*__DATA__*/;
const COLORS = {deepseek:'var(--m-deepseek)', kimi:'var(--m-kimi)', gemma:'var(--m-gemma)', qwen:'var(--m-qwen)'};
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmt(v, d=2){ return v==null ? '—' : Number(v).toFixed(d); }

function openLightbox(src){ document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').hidden = false; }
function closeLightbox(){ document.getElementById('lightbox').hidden = true; }
document.getElementById('lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') closeLightbox(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLightbox(); });

function diagramBox(src, label){
  if(src) return `<figure class="diagram-box"><img src="${esc(src)}" alt="${esc(label)}" onclick="openLightbox('${esc(src)}')"></figure>`;
  return `<div class="diagram-box"><span class="placeholder">${esc(label)}<br>not rendered</span></div>`;
}

function modelCard(m){
  const maxGed = Math.max(1, ...m.scenarios.map(s => s.weighted_ged || 0));
  const barChart = m.scenarios.length ? `<div class="bar-chart">${m.scenarios.map(s => `
    <div class="bar-row">
      <span class="idx">${s.index}</span>
      <div class="bar-track">${s.weighted_ged!=null ? `<div class="bar-fill" style="width:${Math.max(3,100*s.weighted_ged/maxGed)}%"></div>` : ''}</div>
      <span class="val">${s.weighted_ged!=null ? s.weighted_ged.toFixed(1) : '—'}</span>
    </div>`).join('')}</div>` : '<p class="not-rendered">No modifiability report for this project.</p>';

  const rows = m.scenarios.map((s, i) => `
    <tr class="clickable" data-model="${esc(m.key)}" data-idx="${i}">
      <td class="num">${s.index}</td>
      <td class="desc">${esc(s.description || '—')}</td>
      <td class="num">${s.weight ?? '—'}</td>
      <td class="num">${esc(s.magnitude || '—')}</td>
      <td class="num">${s.error ? '<span class="sc-error">error</span>' : fmt(s.weighted_ged,1)}</td>
      <td class="num">${s.diagram_png ? 'view →' : '<span class="not-rendered">n/a</span>'}</td>
    </tr>`).join('');

  return `<section class="model-card" style="--card-color:${COLORS[m.key]}">
    <div class="card-head">
      <h2>${esc(m.label)}</h2>
      <div class="card-metrics">
        <span>Score <b>${fmt(m.score,1)}</b></span>
        <span>Normalized <b>${fmt(m.normalized_score,3)}</b></span>
      </div>
    </div>
    <div class="diagram-row">
      ${diagramBox(m.baseline_png, 'Baseline diagram')}
      ${barChart}
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>#</th><th>Scenario</th><th class="num">Weight</th><th class="num">Magnitude</th><th class="num">Weighted GED</th><th class="num">Diagram</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>`;
}

function render(){
  document.getElementById('title').textContent = `Spotlight: ${DATA.project}`;
  document.getElementById('sub-line').textContent =
    `Selected as the lowest average modifiability score across all four models (cheapest, most robust to its 5 future-change scenarios). DeepSeek and Kimi share the exact same 5 scenario texts by design; Gemma and Qwen each generated their own independently.`;

  const sameScenarios = (DATA.models.find(m=>m.key==='deepseek')?.scenarios||[]).map(s=>s.description);
  const kimiScenarios = (DATA.models.find(m=>m.key==='kimi')?.scenarios||[]).map(s=>s.description);
  const shared = sameScenarios.length && JSON.stringify(sameScenarios)===JSON.stringify(kimiScenarios);
  document.getElementById('shared-note-slot').innerHTML = shared
    ? `<div class="shared-note">DeepSeek and Kimi were scored against the identical 5 scenarios below — the weighted-GED difference per scenario is a direct, controlled comparison of how much structural change each model's edit required for the same request.</div>`
    : '';

  document.getElementById('cards').innerHTML = DATA.models.map(modelCard).join('');

  document.getElementById('cards').addEventListener('click', e => {
    const tr = e.target.closest('tr.clickable');
    if(!tr) return;
    const m = DATA.models.find(x => x.key === tr.dataset.model);
    const s = m.scenarios[Number(tr.dataset.idx)];
    if(s.diagram_png) openLightbox(s.diagram_png);
  });

  document.getElementById('footer-generated').textContent = 'generated ' + new Date(DATA.generated_at).toLocaleString();
}
render();
</script>
</body></html>
